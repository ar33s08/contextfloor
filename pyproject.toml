[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
backend_path = ["setuptools"]

[project]
name = "contextfloor"
version = "0.1.0"
description = "Measure and gate what your AI agent loads before you type a word: the context floor. Per-file attribution across agents and tokenizers, fixtures-as-contract, CI baseline diffs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai-agents", "context-window", "tokens", "claude-code", "codex", "hermes", "mcp", "observability", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# gpt token counts become exact (not estimated) when tiktoken is installed.
exact = ["tiktoken>=0.3"]

[project.scripts]
ctxfloor = "contextfloor.cli:main"
contextfloor = "contextfloor.cli:main"

[tool.setuptools]
packages = ["contextfloor", "contextfloor.adapters"]

[tool.pytest.config]
testpaths = ["tests"]
